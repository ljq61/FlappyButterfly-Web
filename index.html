<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlappyButterfly</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #100c22; color: #ffdfb0; font-family: sans-serif;
      -webkit-user-select: none; user-select: none; touch-action: none; }
    #viewport { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { position: relative; background: #100c22; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
      gap: 18px; align-items: center; justify-content: center; background: #100c22;
      font-size: clamp(14px, 3vh, 24px); }
    progress { width: 70%; accent-color: #be89dd; }
  </style>
</head>
<body>
  <main id="viewport">
    <div id="game">
      <canvas id="unity-canvas" width="450" height="800" tabindex="0"
        aria-label="Flappy Butterfly. Click, tap or press Space to flap."></canvas>
      <div id="loading" role="status"><span id="message">Loading Flappy Butterfly…</span>
        <progress id="progress" max="1" value="0"></progress></div>
    </div>
  </main>
  <script src="Build/FlappyButterfly-Web.loader.js"></script>
  <script>
    const viewport = document.getElementById('viewport');
    const game = document.getElementById('game');
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    let player = null;
    function resize() {
      const style = getComputedStyle(viewport);
      const width = viewport.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = viewport.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      const gameHeight = Math.max(1, Math.min(height, width * 16 / 9));
      game.style.height = gameHeight + 'px';
      game.style.width = gameHeight * 9 / 16 + 'px';
    }
    new ResizeObserver(resize).observe(viewport);
    resize();
    function syncVisibility() {
      if (player) player.SendMessage('WebGLBrowserLifecycle', 'SetBrowserVisible',
        document.hidden || !document.hasFocus() ? '0' : '1');
    }
    document.addEventListener('visibilitychange', syncVisibility);
    window.addEventListener('blur', syncVisibility);
    window.addEventListener('focus', syncVisibility);
    canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('keydown', event => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code))
        event.preventDefault();
    });
    createUnityInstance(canvas, {
      dataUrl: 'Build/FlappyButterfly-Web.data.unityweb',
      frameworkUrl: 'Build/FlappyButterfly-Web.framework.js.unityweb',
      codeUrl: 'Build/FlappyButterfly-Web.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "GHunter Games",
      productName: "FlappyButterfly",
      productVersion: "1.0"
    }, progress => document.getElementById('progress').value = progress)
      .then(instance => {
        player = instance;
        loading.hidden = true;
        loading.style.display = 'none';
        syncVisibility();
      }).catch(() => {
        document.getElementById('message').textContent = 'Unable to load. Please refresh and try again.';
        document.getElementById('progress').hidden = true;
      });
  </script>
</body>
</html>
